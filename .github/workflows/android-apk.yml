# ═══ بناءُ APK على GitHub ═══
# كلُّ دفعٍ إلى main (أو Actions ← Android APK ← Run workflow) يبني التطبيق،
# ويضع الـ APK في Artifacts وفي صفحة Releases للتحميل المباشر.
# بلا أسرار: APK تجريبيّ (debug) يُثبَّت عادياً.
# مع الأسرار الأربعة (README): APK إصدارٍ موقَّع + AAB لـ Google Play.
name: Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build www
        env:
          # اختياري: Client ID لتطبيق OAuth (زرّ «سجّل الدخول عبر GitHub»)
          # Settings ← Secrets and variables ← Actions ← Variables ← OAUTH_CLIENT_ID
          GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
        run: node scripts/build-www.js

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          node scripts/android-patch.js ${{ github.run_number }}

      - name: Icons and splash
        continue-on-error: true
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor "#0d1117" --iconBackgroundColorDark "#0d1117" \
            --splashBackgroundColor "#0d1117" --splashBackgroundColorDark "#0d1117"

      - name: Sync
        run: npx cap sync android

      - name: Signing available?
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "on=0" >> "$GITHUB_OUTPUT"; fi

      - name: Build debug APK
        if: steps.sign.outputs.on == '0'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/ZipToGitHub-${{ github.run_number }}.apk

      - name: Build signed release
        if: steps.sign.outputs.on == '1'
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/ZipToGitHub-${{ github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/ZipToGitHub-${{ github.run_number }}.aab

      - name: Version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ZipToGitHub-apk-${{ github.run_number }}
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build{1}', steps.ver.outputs.v, github.run_number) }}
          name: ZIP إلى GitHub v${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          prerelease: ${{ steps.sign.outputs.on == '0' }}
          body: |
            حمّل **ZipToGitHub-${{ github.run_number }}.apk** على هاتفك وثبّته
            (اسمح بالتثبيت من مصادر غير معروفة إن طُلب).
          files: out/*
